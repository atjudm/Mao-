const CH=[['序章 砕けた核','街の外でモンスターを3体倒せ',()=>S.k>=3,'世界の中心に浮かんでいた「ミュトスの核」が砕け散り、その欠片が辺境じゅうに降りそそいだ。欠片に引き寄せられた魔物があふれ、街は怯えている。長老があなたに言う。「旅人よ、力を示してくれ。まずは街の外の魔物を3体倒すのだ」','「見事だ。だが魔物は欠片の力に酔っているだけ…。本当の脅威はまだ先にある」'],['第1章 森の恵み','木を10個集めよ(行動ボタン)',()=>S.gw>=10,'欠片を探す長旅には拠点が要る。長老「森の木で資材を集めなさい。木はすべての始まりじゃ」','木の香りに包まれて、旅の準備が整った。'],['第2章 拠点づくり','建築ONでブロックを6個置け',()=>S.pl>=6,'「作成」で木ブロックを作り、建築ONで行動ボタンを押して置こう。あなた自身の家が、冒険の拠点になる。','小さな家が建った。ここが、あなたの帰る場所になる。'],['第3章 隣の街へ','別の街を2つ訪れよ',()=>Object.keys(S.tw).length>=3,'長老「他の街にも欠片の手がかりがあるはずだ。外の街へ向かい、人々と会ってきなさい」','街の人々は口をそろえて言った。「欠片は、強い魔物の体に宿っている」'],['第4章 ペットの絆','ペットレースで1位を取れ',()=>S.w>=1,'旅の相棒はペットだ。メニューのレースで絆を深め、勝利して速さを磨こう。','ペットが誇らしげに鳴いた。もう、ただの相棒ではない。'],['第5章 力の目覚め','固有能力を1つ入手せよ',()=>P.uq.length>=1,'欠片の力は、倒した敵から稀にあなたへ移る。「固有能力」を手に入れるまで戦い続けよう。','胸の奥が熱い。欠片の力が、あなたの中で目覚めた。'],['第6章 欠片の群れ','モンスターを30体倒せ',()=>S.k>=30,'魔物たちは欠片の力で凶暴になっている。数をこなし、辺境の安全を取り戻そう。','静けさが戻った。だが、遠くで巨大な気配が動いている。'],['第7章 英雄の資格','Lv10に到達せよ',()=>P.lv>=10,'長老「世界の核を直せるのは、器を持つ者だけ。英雄の資格を示すのだ」','あなたは確かに英雄の器を示した。長老が深くうなずく。'],['第8章 海の向こうへ','ボートを作り、水辺で行動して乗り込め',()=>S.sea>=1,'伝承によれば、最大の欠片は海の向こうにある。作成メニューでボートを作り、海へ漕ぎ出そう。','潮風が頬をなでる。見たことのない世界が広がっている。'],['第9章 世界の果て','始まりの街から150マス離れよ',()=>dist()>=150,'地平線の向こうに欠片の輝きが見える。ひたすら進み、世界の果てを目指そう。','ここまで来た者は、きっと他にいない。'],['第10章 欠片を砕く者','モンスターを100体倒せ',()=>S.k>=100,'欠片を宿した魔物たちが、あなたを待ち受けている。100体を超える戦いが、核の復活の鍵になる。','欠片がひとつに集まり、空へ昇っていく。'],['最終章 ミュトスの再誕','Lv20に到達せよ',()=>P.lv>=20,'核の復活には、あなた自身の力が必要だ。Lv20に達したとき、世界が答える。','ミュトスの核が輝きを取り戻し、辺境に朝が訪れた。…しかし、空の彼方でもうひとつの光が瞬いた。第二部へ続く。']];
